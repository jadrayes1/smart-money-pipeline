# Publishes which tickers are trending on Reddit (via ApeWisdom) and
# StockTwits, to the same public Gist as the other files in this repo. See
# scripts/generateTrendingSocial.js for the full rationale, including why
# X/Twitter and Facebook/Instagram aren't sources here (confirmed live:
# both are hard dead ends for free/public access in 2026, not a gap this
# pipeline works around).
#
# Every 2 hours, not daily like this repo's other jobs — "trending" loses
# its value if it's a day stale, and both sources are free/keyless/public
# with no daily quota to protect (unlike Alpha Vantage elsewhere in this
# app's pipelines), so there's no cost reason to run it less often.
#
# One-time setup required (this workflow can't do these for you):
#   1. Add a repository secret named GIST_ID — the SAME Gist ID the other
#      pipelines already publish to.
#   2. Add a repository secret named GIST_TOKEN — the SAME kind of
#      Personal Access Token the other pipelines use (CLASSIC type, scoped
#      to ONLY "gist").
# No other API key needed — both sources are free and keyless.

name: Generate trending social cache

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate trending social cache
        run: node scripts/generateTrendingSocial.js

      - name: Publish to gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          gh gist edit "${{ secrets.GIST_ID }}" --filename trendingSocialCache.json trendingSocialCache.json || \
          gh gist edit "${{ secrets.GIST_ID }}" --add trendingSocialCache.json

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'trending-social-pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Trending-social pipeline failed',
                body: `The trending-social generation run failed.\n\nRun: ${runUrl}\n\nCheck the GIST_TOKEN/GIST_ID secrets and ApeWisdom's/StockTwits' API status.`,
                labels: [label],
              });
            }

      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'trending-social-pipeline-failure';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Trending-social pipeline succeeded again — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
