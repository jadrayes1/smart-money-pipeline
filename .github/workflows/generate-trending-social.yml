# Publishes which tickers are trending on Reddit (via ApeWisdom) and
# StockTwits, to the same public Gist as the other files in this repo. See
# scripts/generateTrendingSocial.js for the full rationale, including why
# X/Twitter and Facebook/Instagram aren't sources here (confirmed live:
# both are hard dead ends for free/public access in 2026, not a gap this
# pipeline works around).
#
# Every 2 hours, not daily like this repo's other jobs — "trending" loses
# its value if it's a day stale, and both sources are free/keyless/public
# with no daily quota to protect (unlike Alpha Vantage elsewhere in this
# app's pipelines), so there's no cost reason to run it less often.
#
# One-time setup required (this workflow can't do these for you):
#   1. Add a repository secret named GIST_ID — the SAME Gist ID the other
#      pipelines already publish to.
#   2. Add a repository secret named GIST_TOKEN — the SAME kind of
#      Personal Access Token the other pipelines use (CLASSIC type, scoped
#      to ONLY "gist").
# No other API key needed — both sources are free and keyless.

name: Generate trending social cache

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# Shares a concurrency group with every other gist-publisher in this repo --
# see stock-metrics-pipeline's generate-sector-metrics.yml for the full
# root-cause history of why a bare `gh gist edit` (this workflow's own
# publish step until now) could silently revert a fresher publish from any
# other writer, including one in a completely different repository. This
# group is just an optimization against same-repo contention; the
# git-clone + force-with-lease + retry pattern below is the actual
# cross-repo-safe mechanism.
concurrency:
  group: smart-money-gist-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate trending social cache
        run: node scripts/generateTrendingSocial.js

      - name: Publish to gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -e
          CLONE_URL="https://${GIST_TOKEN}@gist.github.com/${GIST_ID}.git"
          attempt=1
          while true; do
            rm -rf gist-clone
            git clone --depth 1 "$CLONE_URL" gist-clone
            if diff -q trendingSocialCache.json gist-clone/trendingSocialCache.json >/dev/null 2>&1; then
              echo "No changes to publish."
              break
            fi
            EXPECTED_SHA=$(git -C gist-clone rev-parse HEAD)
            cp trendingSocialCache.json gist-clone/trendingSocialCache.json
            ( cd gist-clone
              git config user.email "actions@github.com"
              git config user.name "smart-money-pipeline"
              git checkout --orphan latest-snapshot
              git add -A
              git commit -m "Update trending social cache $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git branch -M main
              git push --force-with-lease="main:${EXPECTED_SHA}" origin main
            ) && { echo "Published on attempt $attempt."; break; }
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 5 ]; then
              echo "::error::Publish rejected 5 times in a row -- the gist kept changing underneath this run. Not forcing; re-dispatch once things settle."
              exit 1
            fi
            echo "Push rejected (remote moved since clone) — retrying (attempt ${attempt}/5)..."
          done

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'trending-social-pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Trending-social pipeline failed',
                body: `The trending-social generation run failed.\n\nRun: ${runUrl}\n\nCheck the GIST_TOKEN/GIST_ID secrets and ApeWisdom's/StockTwits' API status.`,
                labels: [label],
              });
            }

      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'trending-social-pipeline-failure';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Trending-social pipeline succeeded again — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
