# Publishes recent (~30 day) insider Form 4 open-market buy/sell activity,
# across the FULL covered universe. See scripts/generateInsiderActivity.js
# for the full rationale and design.
#
# Daily — SEC requires Form 4 filing within 2 business days of a
# transaction, and the published "last 30 days" window is time-sensitive.
# Scheduled at 18:00 UTC, clear of every other job writing to the same
# Gist (00:00 main pipeline, ~12:00 P/FCF cache, 14:00 foreign filings,
# 17:00 foreign P/FCF cache, 20:00 Sundays smart money holdings).
#
# Comparable in scope to stock-metrics-pipeline's own main daily job (a
# full-universe crawl, not a narrow gap-ticker sweep) — timeout set
# generously to match.
#
# One-time setup required (this workflow can't do these for you):
#   1. Add a repository secret named GIST_ID — the SAME Gist ID the other
#      pipelines already publish to.
#   2. Add a repository secret named GIST_TOKEN — the SAME kind of
#      Personal Access Token the other pipelines use (CLASSIC type, scoped
#      to ONLY "gist").
# No Finnhub/Twelve Data/FMP key needed — this pipeline only calls SEC's
# free, keyless EDGAR API.

name: Generate insider activity

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# Shares a concurrency group with every other gist-publisher in this repo --
# see stock-metrics-pipeline's generate-sector-metrics.yml for the full
# root-cause history (verified live 2026-09-18: a bare `gh gist edit`,
# this workflow's own publish step until now, could silently revert a
# fresher publish from any other writer, including one in a completely
# different repository, since its REST-API read-modify-write has no
# compare-and-swap the way git's own force-with-lease does). This group
# is just an optimization against same-repo contention; the git-clone +
# force-with-lease + retry pattern below is the actual cross-repo-safe
# mechanism.
concurrency:
  group: smart-money-gist-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate insider activity cache
        run: node scripts/generateInsiderActivity.js

      - name: Publish to gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -e
          CLONE_URL="https://${GIST_TOKEN}@gist.github.com/${GIST_ID}.git"
          attempt=1
          while true; do
            rm -rf gist-clone
            git clone --depth 1 "$CLONE_URL" gist-clone
            if diff -q insiderActivityCache.json gist-clone/insiderActivityCache.json >/dev/null 2>&1; then
              echo "No changes to publish."
              break
            fi
            EXPECTED_SHA=$(git -C gist-clone rev-parse HEAD)
            cp insiderActivityCache.json gist-clone/insiderActivityCache.json
            ( cd gist-clone
              git config user.email "actions@github.com"
              git config user.name "smart-money-pipeline"
              git checkout --orphan latest-snapshot
              git add -A
              git commit -m "Update insider activity cache $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git branch -M main
              git push --force-with-lease="main:${EXPECTED_SHA}" origin main
            ) && { echo "Published on attempt $attempt."; break; }
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 5 ]; then
              echo "::error::Publish rejected 5 times in a row -- the gist kept changing underneath this run. Not forcing; re-dispatch once things settle."
              exit 1
            fi
            echo "Push rejected (remote moved since clone) — retrying (attempt ${attempt}/5)..."
          done

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Insider activity pipeline failed',
                body: `The daily generation run failed.\n\nRun: ${runUrl}\n\nCheck the GIST_TOKEN and GIST_ID secrets, and SEC EDGAR's API status.`,
                labels: [label],
              });
            }

      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pipeline-failure';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Pipeline succeeded again — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
