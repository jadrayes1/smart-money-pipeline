# Publishes, per ticker, which tracked well-known investors currently hold
# it — sourced from SEC 13F-HR filings (free, quarterly, filed ~45 days
# after quarter-end). See scripts/generateSmartMoneyHoldings.js for the
# full rationale and design.
#
# Weekly, not daily — 13F holdings only change once a quarter, and running
# more often than that just spends the ~2600ms-per-batch OpenFIGI mapping
# budget (7000+ CUSIPs across the current roster, ~30+ minutes) for no new
# information. Scheduled at 20:00 UTC Sundays, clear of every other job
# writing to the same Gist (00:00 main pipeline, ~12:00 P/FCF cache, 14:00
# foreign filings, 17:00 foreign P/FCF cache, 18:00 insider activity).
#
# One-time setup required (this workflow can't do these for you):
#   1. Add a repository secret named GIST_ID — the SAME Gist ID the other
#      pipelines already publish to.
#   2. Add a repository secret named GIST_TOKEN — the SAME kind of
#      Personal Access Token the other pipelines use (CLASSIC type, scoped
#      to ONLY "gist").
# No Finnhub/Twelve Data/FMP key needed — this pipeline only calls SEC's
# free, keyless EDGAR API and OpenFIGI's free, keyless mapping API.

name: Generate smart money holdings

on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# Shares a concurrency group with every other gist-publisher in this repo --
# see stock-metrics-pipeline's generate-sector-metrics.yml for the full
# root-cause history. This group is just an optimization against same-repo
# contention; the git-clone + force-with-lease + retry pattern below (an
# upgrade from this workflow's own prior bare, non-retrying `git push`,
# which would have failed the whole job outright on any real contention
# instead of self-healing) is the actual cross-repo-safe mechanism.
concurrency:
  group: smart-money-gist-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate smart money holdings
        run: node scripts/generateSmartMoneyHoldings.js

      # Git-clone-based publish, not `gh gist edit` — the output file is
      # ~3MB with the full 23-fund roster, over the Gist API's 1MB-per-file
      # publish limit. Same pattern already used by stock-metrics-pipeline's
      # own oversized files (marketMetrics.json etc.) for the same reason.
      - name: Publish to gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -e
          CLONE_URL="https://${GIST_TOKEN}@gist.github.com/${GIST_ID}.git"
          attempt=1
          while true; do
            rm -rf gist-clone
            git clone --depth 1 "$CLONE_URL" gist-clone
            if diff -q smartMoneyHoldings.json gist-clone/smartMoneyHoldings.json >/dev/null 2>&1; then
              echo "No changes to publish."
              break
            fi
            EXPECTED_SHA=$(git -C gist-clone rev-parse HEAD)
            cp smartMoneyHoldings.json gist-clone/smartMoneyHoldings.json
            ( cd gist-clone
              git config user.email "actions@github.com"
              git config user.name "smart-money-pipeline"
              git checkout --orphan latest-snapshot
              git add -A
              git commit -m "Update smart money holdings $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git branch -M main
              git push --force-with-lease="main:${EXPECTED_SHA}" origin main
            ) && { echo "Published on attempt $attempt."; break; }
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 5 ]; then
              echo "::error::Publish rejected 5 times in a row -- the gist kept changing underneath this run. Not forcing; re-dispatch once things settle."
              exit 1
            fi
            echo "Push rejected (remote moved since clone) — retrying (attempt ${attempt}/5)..."
          done

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Smart money holdings pipeline failed',
                body: `The weekly generation run failed.\n\nRun: ${runUrl}\n\nCheck the GIST_TOKEN and GIST_ID secrets, SEC EDGAR's API status, and OpenFIGI's API status.`,
                labels: [label],
              });
            }

      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pipeline-failure';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Pipeline succeeded again — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
